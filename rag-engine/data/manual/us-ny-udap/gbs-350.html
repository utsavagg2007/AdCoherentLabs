<html><head><title>N.Y. Gen. Bus. Law § 350 — False advertising unlawful</title></head><body><main>
<h1>N.Y. Gen. Bus. Law § 350 — False advertising unlawful</h1>
<p>False advertising in the conduct of any business, trade or commerce or in the furnishing of any service in this state is hereby declared unlawful.</p>
</main></body></html>
