name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (CV + NLP + rule engine)
        # The pytest suite runs fully offline: OCR falls back to the blank
        # spaCy pipeline and the embedding fallback degrades gracefully, so
        # no model downloads or asset images are needed here.
        run: python -m pytest -q

      - name: Rule-engine determinism + mutation matrix
        run: python -m pytest eval/test_rule_engine.py -q
