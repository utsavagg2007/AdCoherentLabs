# AdCoherent backend containers (D6): api, worker, scheduler, redis, clamav.
# Joins the EXISTING self-hosted Supabase network. Same file moves to the
# Linux VPS at launch (§15.4).
#
#   python scripts/sync_env.py                 # regenerate the single root .env
#   docker compose -f backend/docker-compose.backend.yml up -d --build
#
# ONE env file: every service reads the repo-root ../.env (relative to this
# file). There is NO compose ${...} interpolation and no backend/.env — the
# entrypoint rebuilds the in-network URLs from that env's secrets when
# APP_IN_CONTAINER=1. Only the reverse proxy ever listens publicly; every
# published port here is loopback-bound for dev (Appendix C).

name: adcoherent-backend

x-app: &app
  image: adcoherent-backend:dev
  env_file: ../.env                # the single source of truth
  environment:
    APP_IN_CONTAINER: "1"          # entrypoint switches host loopback -> service names
  volumes:
    - ..:/repo:ro
  # Cloud mode: Supabase is reached over TLS, so there is no stack network to
  # join. For the self-hosted stack (SUPABASE_MODE=local) add `supabase_default`
  # here AND re-declare it under `networks:` at the bottom of this file.
  networks: [backend]
  restart: unless-stopped

services:
  api:
    <<: *app
    build:
      context: ..
      dockerfile: backend/Dockerfile
      # MUST be explicit. backend/Dockerfile is multi-stage and `runtime` is the
      # last stage, so omitting this silently builds the deployable image: every
      # local build would then copy the whole repo in and run the import gate,
      # only for the `..:/repo:ro` mount below to hide the result. `dev` is the
      # dependencies-only stage this bind-mount workflow expects.
      target: dev
    command: ["api"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_started
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    volumes:
      - ..:/repo:ro
      - paddlex-models:/root/.paddlex     # OCR models warm once per volume
    depends_on:
      redis:
        condition: service_started
    stop_grace_period: 120s               # SIGTERM drain (§10.4)

  scheduler:
    <<: *app
    command: ["scheduler"]

  redis:
    image: redis:7-alpine
    env_file: ../.env                     # provides REDIS_PASSWORD (same source)
    # shell form so $REDIS_PASSWORD expands from env_file (no ${} interpolation)
    entrypoint: ["sh", "-c",
      "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"     # host-dev tests; loopback only
    networks: [backend]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"     # host-dev tests; loopback only
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s          # first virus-db download takes a while

volumes:
  paddlex-models:

networks:
  backend:
  # supabase_default:        # self-hosted stack only -- see the note in x-app
  #   external: true
