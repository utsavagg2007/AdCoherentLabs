# AdCoherent backend containers (D6): api, worker, scheduler, redis, clamav.
# Joins the EXISTING self-hosted Supabase network. Same file moves to the
# Linux VPS at launch (§15.4).
#
#   cd backend
#   python scripts/gen_env.py          # AFTER supabase/harden.py (spec P0)
#   docker compose -f docker-compose.backend.yml up -d --build
#
# ${...} interpolation reads backend/.env (this directory's compose .env).
# Only the reverse proxy ever listens publicly; every published port here is
# loopback-bound for dev (Appendix C).

name: adcoherent-backend

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: adcoherent-backend:dev
    command: ["api"]
    env_file: .env
    environment:
      # in-network endpoints override the host-dev values in .env
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      DATABASE_URL_API: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      DATABASE_URL_WORKER: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLAMAV_HOST: clamav
    volumes:
      - ..:/repo:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_started
      clamav:
        condition: service_healthy
    networks: [backend, supabase_default]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: adcoherent-backend:dev
    command: ["worker"]
    env_file: .env
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      DATABASE_URL_WORKER: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ..:/repo:ro
      - paddlex-models:/root/.paddlex     # OCR models warm once per volume
    depends_on:
      redis:
        condition: service_started
    networks: [backend, supabase_default]
    restart: unless-stopped
    stop_grace_period: ${STOP_GRACE_SECONDS:-120}s   # SIGTERM drain (§10.4)

  scheduler:
    image: adcoherent-backend:dev
    command: ["scheduler"]
    env_file: .env
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      DATABASE_URL_WORKER: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ..:/repo:ro
    networks: [backend, supabase_default]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"     # host-dev tests; loopback only
    networks: [backend]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"     # host-dev tests; loopback only
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s          # first virus-db download takes a while

volumes:
  paddlex-models:

networks:
  backend:
  supabase_default:
    external: true
