[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:paddle.*
    ignore::UserWarning:paddle.*
markers =
    embed: loads the real frozen embedding model (cached locally; slower)
    ocr_engine: runs a real OCR backend (very slow; opt in with RUN_OCR_TESTS=1)
